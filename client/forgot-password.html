<!DOCTYPE html>
<html lang="en">

<head>
<script src="js/lz-remember.js?v=2"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>Forgot Password - Lizimas Store</title>
<link rel="stylesheet" href="css/style.css?v=86">
<link rel="stylesheet" href="css/auth.css?v=13">
</head>

<body data-portal="customer">

<div class="checkout-page auth-page">

    <header class="checkout-header">
        <div class="checkout-logo-row">
            <div class="checkout-logo-badge"><img src="https://res.cloudinary.com/ag407tk0/image/upload/whatsapp-gold.jpg" alt="Lizimas Store" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block"></div>
            <h1 class="checkout-brand-name">Lizimas Store</h1>
        </div>
        <div class="checkout-secure-badge">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#067647" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/></svg>
            <span id="auth-badge-text">Secure Account</span>
        </div>
    </header>

    <nav class="checkout-nav-links">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart</a>
        <a href="login.html">Sign in</a>
    </nav>

    <div class="auth-card">
        <div class="auth-card-head">
            <div class="auth-icon-badge"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#E8B33A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
            <h2 class="auth-title">Forgot your password?</h2>
            <p class="auth-subtitle">Enter the email you signed up with and we'll send you a link to set a new password.</p>
        </div>

        <div class="auth-field">
            <label class="auth-label" for="forgot-email">Email Address</label>
            <span class="auth-input-wrap">
                <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="#0f1b3d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="m22 6-10 7L2 6"/></svg>
                <input id="forgot-email" type="email" placeholder="Enter your email address" autocomplete="email">
            </span>
        </div>

        <p id="forgot-status" class="auth-error" role="status"></p>

        <button id="forgot-submit-btn" class="auth-submit" onclick="sendResetLink()">Send Reset Link</button>

        <p class="auth-foot">
            <a href="login.html">Back to Sign in</a>
        </p>
    </div>

</div>

<script src="js/api.js?v=1"></script>
<script src="js/forgot-password.js?v=2"></script>
<script src="js/auth-enter.js?v=3"></script>
</body>
</html>
