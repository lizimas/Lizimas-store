<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details | Lizimas Store</title>

<meta name="description" content="Shop quality products at Lizimas Store with fast delivery across Uganda and Mobile Money payment options.">
<link rel="stylesheet" href="/css/style.css?v=60">
<link rel="stylesheet" href="/css/product-detail.css?v=24">
</head>
<body>

<div class="pd-topbar">
    <button class="pd-back-btn" onclick="window.location.href='/index.html'">&larr;</button>
    <a href="/cart.html" class="pd-cart-btn">
        🛒 <span id="pd-cart-count" class="js-cart-count">0</span>
    </a>
</div>

<nav class="pd-breadcrumbs" id="pd-breadcrumbs" aria-label="Breadcrumb"></nav>

<div class="pd-layout">
<div class="pd-gallery-col">
<div class="pd-thumbs" id="pd-thumbs"></div>
<div class="pd-gallery">
    <div id="pd-gallery-scroll" class="pd-gallery-scroll"></div>
    <div id="pd-gallery-counter" class="pd-gallery-counter">1/1</div>
</div>
</div>

<div id="pd-fullscreen-viewer" class="pd-fullscreen-viewer hidden">
    <button id="pd-fullscreen-close" class="pd-fullscreen-close">&times;</button>
    <button id="pd-fullscreen-share" class="pd-fullscreen-share">&#8599;</button>
    <div id="pd-fullscreen-counter" class="pd-fullscreen-counter">1/1</div>
    <div id="pd-fullscreen-scroll" class="pd-fullscreen-scroll"></div>
</div>

<div class="pd-info">
    <h1 id="pd-name"></h1>
    <div id="pd-item-id" class="pd-item-id"></div>
    <div id="pd-rating" class="pd-rating"></div>
    <div class="pd-price-row">
        <div id="pd-price" class="pd-price"></div>
        <div id="pd-warranty" class="pd-warranty hidden"></div>
    </div>

    <div id="pd-selector-section" class="pd-selector-section hidden"></div>

    <div class="pd-sticky-bar">
        <button id="pd-add-to-cart-btn" class="pd-add-to-cart-btn">Add To Cart 🛒</button>
    </div>

    <div id="pd-details-card" class="pd-card"></div>
</div>

<div class="pd-tabs-col">

    <section class="pd-section" id="pd-reviews-section">
        <h2 class="pd-section-title">Customer Reviews</h2>
        <div id="pd-reviews" class="pd-reviews"></div>
    </section>

    <section class="pd-section" id="pd-desc-section">
        <h2 class="pd-section-title">Description</h2>
        <div id="pd-desc-blocks" class="pd-desc-blocks"></div>
        <p id="pd-description"></p>
    </section>

    <section class="pd-section" id="pd-specs-section">
        <h2 class="pd-section-title">Specifications</h2>
        <table id="pd-specs-table" class="pd-specs-table"></table>
    </section>

</div>
</div>

<script src="/js/api.js"></script>
<script src="/js/cart.js?v=6"></script>
<script src="/js/product-detail.js?v=19"></script>
<script src="/js/description-blocks.js?v=5"></script>

</body>
</html>
