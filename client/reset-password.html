<!DOCTYPE html>
<html lang="en">

<head>
<script src="js/lz-remember.js?v=2"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>Reset Password - Lizimas Store</title>
<link rel="stylesheet" href="css/style.css?v=86">
<link rel="stylesheet" href="css/auth.css?v=13">
</head>

<body>

<div class="checkout-page auth-page">

    <header class="checkout-header">
        <div class="checkout-logo-row">
            <div class="checkout-logo-badge"><img src="https://res.cloudinary.com/ag407tk0/image/upload/whatsapp-gold.jpg" alt="Lizimas Store" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block"></div>
            <h1 class="checkout-brand-name">Lizimas Store</h1>
        </div>
        <div class="checkout-secure-badge">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#067647" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/></svg>
            <span id="auth-badge-text">Secure Account</span>
        </div>
    </header>

    <nav class="checkout-nav-links" id="reset-nav">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="login.html" data-login-link>Sign in</a>
    </nav>

    <div class="auth-card">
        <div class="auth-card-head">
            <div class="auth-icon-badge"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#E8B33A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
            <h2 class="auth-title">Set a new password</h2>
            <p class="auth-subtitle" id="reset-subtitle">Choose a new password for your account.</p>
        </div>

        <div class="auth-field">
            <label class="auth-label" for="new-password">New password</label>
            <span class="auth-input-wrap">
                <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="#0f1b3d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <input id="new-password" type="password" placeholder="New password" autocomplete="new-password">
            </span>
            <p class="auth-hint" id="reset-rule"></p>
        </div>

        <div class="auth-field">
            <label class="auth-label" for="confirm-password">Confirm new password</label>
            <span class="auth-input-wrap">
                <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="#0f1b3d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <input id="confirm-password" type="password" placeholder="Type it again" autocomplete="new-password">
            </span>
        </div>

        <p id="reset-status" class="auth-error" role="status"></p>

        <button id="reset-submit-btn" class="auth-submit" onclick="submitNewPassword()">Save new password</button>

        <p class="auth-foot">
            <a href="login.html" data-login-link>Back to Sign in</a>
        </p>
    </div>

</div>

<script src="js/api.js?v=1"></script>
<script src="js/reset-password.js?v=2"></script>
<script src="js/password-toggle.js?v=2"></script>
<script src="js/auth-enter.js?v=3"></script>
</body>
</html>
