<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>Lizimas Store — Staff Login</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

    <div id="login-screen" class="login-screen">
        <div class="login-box">
            <h1>Lizimas Store</h1>
            <p class="subtitle">Staff Login</p>
            <input type="email" id="login-email" placeholder="Staff email">
            <input type="password" id="login-password" placeholder="Password">
            <button id="login-btn" onclick="handleStaffLogin()">Log In</button>

            <input type="text" id="login-2fa-code" class="hidden" placeholder="Enter 6-digit code">
            <button id="login-2fa-btn" class="hidden" onclick="submitStaffLogin2FA()">Verify Code</button>
            <button id="login-2fa-email-btn" class="hidden" onclick="requestEmailLoginCode()" style="background:none; border:none; color:#C9A227; text-decoration:underline; cursor:pointer; font-size:14px; padding:8px 0;">Email me a code instead</button>

            <input type="password" id="login-reset-password" class="hidden" placeholder="New password">
            <input type="password" id="login-reset-password-confirm" class="hidden" placeholder="Confirm new password">
            <button id="login-reset-btn" class="hidden" onclick="submitStaffForcedReset()">Set New Password</button>

            <div id="login-setup-block" class="hidden">
                <p class="setup-note">Scan this with your authenticator app, then enter the code below.</p>
                <img id="login-setup-qr" alt="2FA QR Code" style="max-width:200px; display:block; margin:12px auto;">
                <p style="font-size:13px; word-break:break-all;">Manual key: <code id="login-setup-key"></code></p>
                <input type="text" id="login-setup-code" placeholder="Enter 6-digit code" inputmode="numeric">
                <button id="login-setup-btn" onclick="submitStaff2FASetup()">Verify &amp; Continue</button>
            </div>

            <p id="login-error" class="error-text"></p>
        </div>
    </div>

    <script src="js/staff-login.js?v=5"></script>
<script src="js/password-toggle.js?v=2"></script>
<script src="js/auth-enter.js?v=2"></script>
</body>
</html>
