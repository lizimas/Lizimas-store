<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>Lizimas Store — Staff Password Reset</title>
<link rel="stylesheet" href="css/admin.css?v=4">
</head>
<body>

    <div id="login-screen" class="login-screen">
        <div class="login-box">
            <h1>Lizimas Store</h1>
            <p class="subtitle">Reset Staff Password</p>

            <input type="password" id="new-password" placeholder="New password">
            <input type="password" id="confirm-password" placeholder="Confirm new password">
            <button id="reset-btn" onclick="submitStaffPasswordReset()">Reset Password</button>

            <p id="reset-status" class="error-text"></p>

            <p style="margin-top:14px; font-size:13px;">
                <a href="staff-login.html" style="color:#C9A227; text-decoration:underline;">Back to Staff Login</a>
            </p>
        </div>
    </div>

    <script src="js/api.js?v=1"></script>
    <script src="js/staff-reset-password.js?v=1"></script>
    <script src="js/password-toggle.js?v=2"></script>
    <script src="js/auth-enter.js?v=3"></script>
</body>
</html>
