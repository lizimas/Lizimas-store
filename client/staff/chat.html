<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Chat | Lizimas Store</title>
<link rel="stylesheet" href="../css/style.css?v=56">
<link rel="stylesheet" href="../css/staff-chat.css?v=10">
</head>

<body class="sc-body">

<header class="sc-topbar">
    <div class="sc-topbar-left">
        <span class="sc-logo">LS</span>
        <span class="sc-topbar-title">Live Chat</span>
        <span class="sc-conn" id="sc-conn" hidden>Offline</span>
    </div>
    <div class="sc-topbar-right">
        <span class="sc-agent" id="sc-agent"></span>
        <button class="sc-btn sc-btn-ghost" id="sc-account-btn" onclick="StaffAccount.open()">Account</button>
        <button class="sc-btn sc-btn-ghost" id="sc-logout">Log out</button>
    </div>
</header>

<main class="sc-shell" id="sc-shell">

    <!-- Panel 1: conversation list -->
    <section class="sc-panel sc-list-panel" id="sc-list-panel">
        <div class="sc-search-wrap">
            <input type="search" id="sc-search" class="sc-search"
                   placeholder="Search name, phone or subject" autocomplete="off">
        </div>

        <div class="sc-filters" id="sc-filters">
            <button class="sc-chip is-active" data-filter="active">Active</button>
            <button class="sc-chip" data-filter="waiting">Waiting</button>
            <button class="sc-chip" data-filter="mine">Mine</button>
            <button class="sc-chip" data-filter="open">Open</button>
            <button class="sc-chip" data-filter="unassigned">Unassigned</button>
            <button class="sc-chip" data-filter="pending">Pending</button>
            <button class="sc-chip" data-filter="closed">Closed</button>
            <button class="sc-chip" data-filter="all">All</button>
        </div>

        <div class="sc-list" id="sc-list">
            <p class="sc-empty">Loading conversations…</p>
        </div>
    </section>

    <!-- Panel 2: the thread -->
    <section class="sc-panel sc-thread-panel" id="sc-thread-panel">
        <div class="sc-thread-head">
            <button class="sc-back" id="sc-back" aria-label="Back to list">‹</button>
            <div class="sc-thread-who">
                <span class="sc-thread-name" id="sc-thread-name">No conversation selected</span>
                <span class="sc-thread-meta" id="sc-thread-meta"></span>
            </div>
            <button class="sc-info-btn" id="sc-info-btn" aria-label="Customer details">i</button>
        </div>

        <div class="sc-messages" id="sc-messages">
            <p class="sc-empty">Pick a conversation from the list.</p>
        </div>

        <div class="sc-composer" id="sc-composer" hidden>
            <textarea id="sc-input" class="sc-input" rows="1"
                      placeholder="Type a reply…"></textarea>
            <button class="sc-send" id="sc-send" aria-label="Send">Send</button>
        </div>
    </section>

    <!-- Panel 3: customer details. A drawer on phones. -->
    <aside class="sc-panel sc-detail-panel" id="sc-detail-panel">
        <div class="sc-detail-head">
            <span>Customer</span>
            <button class="sc-drawer-close" id="sc-detail-close" aria-label="Close">&times;</button>
        </div>

        <div class="sc-detail-body" id="sc-detail-body">
            <p class="sc-empty">No conversation selected.</p>
        </div>
    </aside>

</main>

<div class="sc-scrim" id="sc-scrim" hidden></div>

<div class="sc-acct-modal hidden" id="sc-acct-modal">
  <div class="sc-acct-panel">
    <div class="sc-acct-head">
      <h3>Account security</h3>
      <button type="button" class="sc-acct-close" onclick="StaffAccount.close()">&times;</button>
    </div>
    <div class="sc-acct-body">
      <p id="account-2fa-status">Checking status...</p>
      <button id="account-2fa-toggle-btn" class="sc-btn" onclick="StaffAccount.toggle()">Enable 2FA</button>
      <div id="account-2fa-setup" class="hidden">
        <p>Scan this with your authenticator app:</p>
        <img id="account-2fa-qr" alt="2FA QR Code" style="max-width:200px;">
        <p>Manual entry key: <code id="account-2fa-key"></code></p>
        <input type="text" id="account-2fa-code" placeholder="Enter 6-digit code" inputmode="numeric">
        <button class="sc-btn" onclick="StaffAccount.verify()">Verify &amp; Enable</button>
      </div>
      <p id="account-2fa-msg" class="account-msg"></p>
    </div>
  </div>
</div>

<script src="../js/staff-account.js?v=4"></script>
<script src="../js/staff-chat.js?v=4"></script>

</body>

</html>
